<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 - 河南科技职业大学竞赛管理系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.8/dist/reset.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 20px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    .nav a:hover {
      opacity: 0.8;
    }

    .forgot-section {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin: 40px auto;
      max-width: 400px;
    }

    .forgot-title {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #666;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .password-input-container {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
    }

    .password-toggle:hover {
      color: #667eea;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    .error-message {
      color: red;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .success-message {
      color: green;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #5a6fe4;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #999;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .step {
      display: flex;
      align-items: center;
    }

    .step-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ddd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .step-number.active {
      background: #667eea;
    }

    .step-number.completed {
      background: #52c41a;
    }

    .step-line {
      width: 80px;
      height: 2px;
      background: #ddd;
      margin: 0 10px;
    }

    .step-line.active {
      background: #667eea;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header-content">
      <div class="logo">河南科技职业大学竞赛管理系统</div>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="register.html">立即注册</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="forgot-section">
      <h2 class="forgot-title">忘记密码</h2>

      <div class="step-indicator">
        <div class="step">
          <div class="step-number active" id="step1Number">1</div>
          <div class="step-line" id="step1Line"></div>
        </div>
        <div class="step">
          <div class="step-number" id="step2Number">2</div>
          <div class="step-line" id="step2Line"></div>
        </div>
        <div class="step">
          <div class="step-number" id="step3Number">3</div>
        </div>
      </div>

      <div id="step1" class="step-content">
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" name="username" placeholder="请输入要找回密码的账号" onblur="autoFillPhone(this)">
          <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="phone">手机号</label>
          <input type="tel" id="phone" name="phone" placeholder="请输入账号绑定的手机号" oninput="maskPhone(this)">
          <div id="phoneError" class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="verifyCode">短信验证码</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="verifyCode" name="verifyCode" placeholder="请输入验证码" style="flex: 1;">
            <button type="button" class="btn" id="sendCodeBtn" onclick="sendVerificationCode()"
              style="width: auto; padding: 0 20px;">发送验证码</button>
          </div>
          <div id="verifyCodeError" class="error-message"></div>
        </div>
        <button type="button" class="btn" onclick="verifyUsername()">验证账号</button>
      </div>

      <div id="step2" class="step-content hidden">
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <div class="password-input-container">
            <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码（至少6位）">
            <span class="password-toggle" onclick="togglePassword('newPassword')">👁️</span>
          </div>
          <div id="newPasswordError" class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">确认密码</label>
          <div class="password-input-container">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码">
            <span class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</span>
          </div>
          <div id="confirmPasswordError" class="error-message"></div>
        </div>

        <button type="button" class="btn" onclick="resetPassword()">重置密码</button>
      </div>

      <div id="step3" class="step-content hidden">
        <div style="text-align: center; padding: 40px 0;">
          <div style="font-size: 60px; margin-bottom: 20px;">✓</div>
          <h3 style="color: #52c41a; margin-bottom: 15px;">密码重置成功</h3>
          <p style="color: #666; margin-bottom: 30px;">您的密码已成功重置</p>
          <a href="index.html" class="btn" style="display: inline-block; width: auto; padding: 12px 40px;">返回登录</a>
        </div>
      </div>

      <div class="login-link">
        <a href="index.html">返回登录</a>
      </div>
    </div>
  </div>

  <script>
    let verifiedUsername = '';
    let storedVerificationCode = '';
    let originalPhone = '';

    function maskPhone(input) {
      // 只允许输入数字
      input.value = input.value.replace(/\D/g, '');

      // 保存原始手机号
      if (input.value.length <= 11) {
        originalPhone = input.value;
      }

      // 隐藏中间4位
      if (input.value.length > 3 && input.value.length <= 7) {
        input.value = input.value.slice(0, 3) + '*'.repeat(input.value.length - 3);
      } else if (input.value.length > 7) {
        input.value = input.value.slice(0, 3) + '****' + input.value.slice(7);
      }
    }

    function autoFillPhone(input) {
      const username = input.value.trim();
      if (!username) return;

      try {
        const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
        if (registeredUsers[username] && registeredUsers[username].phone) {
          const phone = registeredUsers[username].phone;
          originalPhone = phone;

          // 显示掩码后的手机号
          const phoneInput = document.getElementById('phone');
          if (phone.length > 7) {
            phoneInput.value = phone.slice(0, 3) + '****' + phone.slice(7);
          } else {
            phoneInput.value = phone;
          }
        }
      } catch (error) {
        console.error('读取localStorage失败:', error);
      }
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const toggle = input.parentElement.querySelector('.password-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.textContent = '🙈';
      } else {
        input.type = 'password';
        toggle.textContent = '👁️';
      }
    }

    function showStep(step) {
      document.querySelectorAll('.step-content').forEach(content => {
        content.classList.add('hidden');
      });
      document.getElementById('step' + step).classList.remove('hidden');

      for (let i = 1; i <= 3; i++) {
        const stepNumber = document.getElementById('step' + i + 'Number');
        if (i < step) {
          stepNumber.classList.add('completed');
          stepNumber.classList.remove('active');
          if (i < 3) {
            document.getElementById('step' + i + 'Line').classList.add('active');
          }
        } else if (i === step) {
          stepNumber.classList.add('active');
          stepNumber.classList.remove('completed');
        } else {
          stepNumber.classList.remove('active', 'completed');
          if (i > 1) {
            document.getElementById('step' + (i - 1) + 'Line').classList.remove('active');
          }
        }
      }
    }

    function sendVerificationCode() {
      const phone = originalPhone;
      const phoneError = document.getElementById('phoneError');
      const sendCodeBtn = document.getElementById('sendCodeBtn');

      phoneError.style.display = 'none';

      if (!phone) {
        phoneError.textContent = '请输入手机号';
        phoneError.style.display = 'block';
        return;
      }

      const phoneRegex = /^1[3-9]\d{9}$/;
      if (!phoneRegex.test(phone)) {
        phoneError.textContent = '请输入正确的手机号码';
        phoneError.style.display = 'block';
        return;
      }

      // 生成随机验证码
      storedVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();

      // 模拟发送短信
      console.log('发送验证码到手机号:', phone, '验证码:', storedVerificationCode);

      // 显示模拟的验证码（实际项目中不会显示）
      const codeDisplay = document.createElement('div');
      codeDisplay.style.cssText = `
        background: #f6ffed;
        border: 1px solid #b7eb8f;
        color: #389e0d;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-size: 14px;
      `;
      codeDisplay.textContent = '验证码已发送，测试验证码为: ' + storedVerificationCode;

      const formGroup = document.getElementById('verifyCode').parentElement;
      formGroup.parentNode.insertBefore(codeDisplay, formGroup.nextSibling);

      // 3秒后自动移除
      setTimeout(() => {
        codeDisplay.remove();
      }, 3000);

      // 禁用发送按钮并倒计时
      let countdown = 60;
      sendCodeBtn.disabled = true;
      sendCodeBtn.textContent = countdown + '秒后重发';

      const timer = setInterval(() => {
        countdown--;
        sendCodeBtn.textContent = countdown + '秒后重发';
        if (countdown <= 0) {
          clearInterval(timer);
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '发送验证码';
        }
      }, 1000);
    }

    function verifyUsername() {
      const username = document.getElementById('username').value.trim();
      const phone = originalPhone;
      const verifyCode = document.getElementById('verifyCode').value.trim();
      const usernameError = document.getElementById('usernameError');
      const phoneError = document.getElementById('phoneError');
      const verifyCodeError = document.getElementById('verifyCodeError');

      usernameError.style.display = 'none';
      phoneError.style.display = 'none';
      verifyCodeError.style.display = 'none';

      if (!username) {
        usernameError.textContent = '请输入账号';
        usernameError.style.display = 'block';
        return;
      }

      if (!phone) {
        phoneError.textContent = '请输入手机号';
        phoneError.style.display = 'block';
        return;
      }

      if (!verifyCode) {
        verifyCodeError.textContent = '请输入验证码';
        verifyCodeError.style.display = 'block';
        return;
      }

      const phoneRegex = /^1[3-9]\d{9}$/;
      if (!phoneRegex.test(phone)) {
        phoneError.textContent = '请输入正确的手机号码';
        phoneError.style.display = 'block';
        return;
      }

      let userFound = false;
      let isDefaultAccount = false;
      let phoneMatched = false;

      try {
        const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
        if (registeredUsers[username]) {
          userFound = true;
          if (registeredUsers[username].phone === phone) {
            phoneMatched = true;
          }
        }
      } catch (error) {
        console.error('读取localStorage失败:', error);
      }

      if (!userFound) {
        const defaultAccounts = ['admin', 'T1001', '1001'];
        if (defaultAccounts.includes(username)) {
          userFound = true;
          isDefaultAccount = true;
        }
      }

      if (!userFound) {
        usernameError.textContent = '该账号不存在';
        usernameError.style.display = 'block';
        return;
      }

      if (isDefaultAccount) {
        usernameError.textContent = '系统预设账号不支持在线找回密码，请联系管理员';
        usernameError.style.display = 'block';
        return;
      }

      if (!phoneMatched) {
        phoneError.textContent = '该手机号与账号不匹配';
        phoneError.style.display = 'block';
        return;
      }

      if (verifyCode !== storedVerificationCode) {
        verifyCodeError.textContent = '验证码错误';
        verifyCodeError.style.display = 'block';
        return;
      }

      verifiedUsername = username;

      setTimeout(() => {
        showStep(2);
      }, 500);
    }

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const newPasswordError = document.getElementById('newPasswordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');

      newPasswordError.style.display = 'none';
      confirmPasswordError.style.display = 'none';

      if (!newPassword) {
        newPasswordError.textContent = '请输入新密码';
        newPasswordError.style.display = 'block';
        return;
      }

      if (newPassword.length < 6) {
        newPasswordError.textContent = '密码长度至少为6位';
        newPasswordError.style.display = 'block';
        return;
      }

      if (!confirmPassword) {
        confirmPasswordError.textContent = '请再次输入新密码';
        confirmPasswordError.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        confirmPasswordError.textContent = '两次输入的密码不一致';
        confirmPasswordError.style.display = 'block';
        return;
      }

      try {
        var resp = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: verifiedUsername,
            phone: originalPhone,
            newPassword: newPassword
          })
        });
        var data = await resp.json();
        if (data.success) {
          showStep(3);
        } else {
          newPasswordError.textContent = data.message || '密码重置失败';
          newPasswordError.style.display = 'block';
        }
      } catch (error) {
        console.error('更新密码失败:', error);
        newPasswordError.textContent = '密码重置失败，请稍后重试';
        newPasswordError.style.display = 'block';
      }
    }
  </script>
</body>

</html>
